[package]
name = "ssh-at"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
serde = { workspace = true }
# preserve_order: rewritten JSON config files keep the user's key order
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true }
ssh-at-core = { workspace = true }
ssh-at-storage = { workspace = true }
dirs = "6.0.0"
tauri-plugin-clipboard-manager = "2.3.2"
image = "0.25"
toml_edit = "0.20"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_System_Environment",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
objc2-foundation = "0.3"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

# Automatically enable custom-protocol in release builds
[profile.release]
inherits = "release"
